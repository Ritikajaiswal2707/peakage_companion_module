# Render Blueprint: one web service + one Postgres database.
# In Render: New → Blueprint → pick this repo. You'll be asked for ADMIN_PHONES and REGISTRATION_CODE.
services:
  - type: web
    name: peakage-lms
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: peakage-lms-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: HTTPS_ONLY
        value: "true"
      - key: ADMIN_PHONES
        sync: false
      - key: REGISTRATION_CODE
        sync: false

databases:
  - name: peakage-lms-db
    plan: free
