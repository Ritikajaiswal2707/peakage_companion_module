<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#18212D">
  <title>{% block title %}PeakAge Companion Academy{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', path='img/favicon.svg') }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}?v=2">
  <script>document.documentElement.classList.replace('no-js', 'js');</script>
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="topbar">
    <a class="brand" href="/" aria-label="PeakAge Companion Academy home">
      <img src="{{ url_for('static', path='img/peakage-logo-light.png') }}" alt="PeakAge" class="brand-logo">
      <span class="brand-sub">Companion Academy</span>
    </a>
    {% if user %}
    <nav class="nav">
      {% if user.is_admin %}<a href="/admin">Admin</a>{% endif %}
      <a href="/dashboard">My journey</a>
      <form method="post" action="/logout"><button class="nav-btn" type="submit">Log out</button></form>
    </nav>
    {% endif %}
  </header>

  {% block hero %}{% endblock %}

  <main class="container">
    {% for m in messages %}
      <div class="flash flash-{{ m.kind }}" role="status">{{ m.message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <img src="{{ url_for('static', path='img/peakage-logo-dark.png') }}" alt="PeakAge" class="footer-logo">
    <div>Right person, right time</div>
  </footer>
  <script src="{{ url_for('static', path='app.js') }}?v=2" defer></script>
</body>
</html>
